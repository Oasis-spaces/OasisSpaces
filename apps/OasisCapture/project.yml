# XcodeGen spec for Oasis Capture, the iPhone app that guides someone through
# recording a room. build.sh generates the Xcode project from this, builds it
# and installs it on the connected iPhone; the .xcodeproj is not checked in.
name: OasisCapture
options:
  bundleIdPrefix: com.oasisspaces
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CaptureRules:
    path: Packages/CaptureRules

targets:
  OasisCapture:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: CaptureRules
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisspaces.capture
        DEVELOPMENT_TEAM: G98G72F2FH
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Oasis Capture
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Oasis Capture films the room and tracks how the phone moves, to guide you while you record.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
