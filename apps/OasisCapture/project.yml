# XcodeGen spec for Oasis Capture, the iPhone app that guides someone through
# recording a room. build.sh generates the Xcode project from this, builds it
# and installs it on the connected iPhone; the .xcodeproj is not checked in.
name: OasisCapture
options:
  bundleIdPrefix: com.oasisspaces
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  CaptureRules:
    path: Packages/CaptureRules
  OasisLink:
    path: ../OasisLink
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter
    exactVersion: 1.0.1

targets:
  OasisCapture:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/RoomSegmentation.mlpackage
      - path: Resources/RoomDepth.mlpackage
      - path: Resources/RoomObjects.mlpackage
    dependencies:
      - package: CaptureRules
      - package: OasisLink
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisspaces.capture
        DEVELOPMENT_TEAM: G98G72F2FH
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Oasis Capture
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Oasis Capture films the room and tracks how the phone moves, to guide you while you record.
        NSLocalNetworkUsageDescription: Oasis Capture sends your recordings to your Mac on the same Wi-Fi and shows the results it makes.
        NSBonjourServices: [_oasisstation._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
