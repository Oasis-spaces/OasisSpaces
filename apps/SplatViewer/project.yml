# XcodeGen spec for the Splat Viewer Mac app. build.sh generates the Xcode
# project from this and builds it; the .xcodeproj itself is not checked in.
name: SplatViewer
options:
  bundleIdPrefix: com.oasisspaces
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter
    exactVersion: 1.0.1
  OasisLink:
    path: ../OasisLink

targets:
  SplatViewer:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
    dependencies:
      - package: OasisLink
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Splat Viewer
        CFBundleName: Splat Viewer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: Oasis-spaces
        NSLocalNetworkUsageDescription: Splat Viewer receives room recordings from the Oasis Capture app on your phone over the local network.
        NSBonjourServices: [_oasisstation._tcp]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Gaussian splat
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.oasisspaces.splat
              - com.oasisspaces.spz
              - public.polygon-file-format
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.oasisspaces.splat
            UTTypeDescription: Gaussian splat
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [splat]
          - UTTypeIdentifier: com.oasisspaces.spz
            UTTypeDescription: Compressed Gaussian splat
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [spz]
          - UTTypeIdentifier: public.polygon-file-format
            UTTypeDescription: PLY file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [ply]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.oasisspaces.furniture
            UTTypeDescription: Furniture from the Splat Viewer library
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_NAME: Splat Viewer
        PRODUCT_BUNDLE_IDENTIFIER: com.oasisspaces.splatviewer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
