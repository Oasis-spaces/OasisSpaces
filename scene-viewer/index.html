<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oasis scene</title>
<style>
  :root { color-scheme: dark; --ink: #f3f1ec; --dim: #a9a59c; --panel: rgba(22, 22, 24, 0.82); --line: rgba(255, 255, 255, 0.09); --accent: #ff9f0a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101012; color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #panel { position: fixed; top: 16px; left: 16px; width: 248px; max-height: calc(100vh - 32px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  h1 { font-size: 15px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
  .row:hover { background: rgba(255, 255, 255, 0.05); }
  .row.selected { background: rgba(255, 159, 10, 0.16); }
  .row input { accent-color: var(--accent); margin: 0; }
  .row .name { flex: 1; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .row .count { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .group { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 8px 4px; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  button { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
    border-radius: 9px; padding: 7px 8px; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, 0.12); }
  button:disabled { opacity: 0.4; cursor: default; }
  #selection { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px;
    background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  #selection[hidden] { display: none; }
  #selection:not([hidden]) ~ #hint { display: none; }
  #selection .title { font-weight: 600; text-transform: capitalize; padding: 0 8px 0 4px; }
  #selection .size { color: var(--dim); font-size: 12px; padding-right: 6px; font-variant-numeric: tabular-nums; }
  #selection button, #selection .size { white-space: nowrap; }
  #selection input[type=color] { flex: none; width: 34px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
    background: none; cursor: pointer; }
  #selection label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 4px; }
  #selection label[hidden], #selection button[hidden] { display: none; }
  #selection input[type=number] { width: 58px; font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; }
  #selection .source { font-size: 11px; padding: 3px 8px; border-radius: 99px; white-space: nowrap; border: 1px solid var(--line); color: var(--dim); }
  #selection .source[data-kind="generated"] { color: #f0a0e0; border-color: rgba(230, 0, 180, 0.5); }
  #selection .source[data-kind="inferred"] { color: #ffc861; border-color: rgba(255, 170, 0, 0.45); }
  #filled { margin: -6px 2px 4px; }
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; z-index: 4; max-width: calc(100vw - 32px); }
  #toast[hidden] { display: none; }
  #hint { position: fixed; bottom: 18px; right: 18px; color: var(--dim); font-size: 12px; text-align: right; pointer-events: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; background: #101012; color: var(--dim); transition: opacity 0.4s; }
  #status.done { opacity: 0; pointer-events: none; }
  #menu { display: none; position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; width: 42px; height: 42px; font-size: 18px;
    background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius: 12px; z-index: 3; }
  @media (max-width: 640px) {
    #menu { display: block; }
    #panel { display: none; top: calc(max(14px, env(safe-area-inset-top)) + 50px); left: 14px; width: min(300px, calc(100vw - 28px)); max-height: 60vh; z-index: 2; }
    #panel.open { display: block; }
    #hint { display: none; }
    #selection { flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); bottom: max(14px, env(safe-area-inset-bottom)); }
    #selection .size { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/",
    "@sparkjsdev/spark": "./vendor/spark/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="status">Loading the room…</div>
<aside id="panel">
  <h1 id="title">Room</h1>
  <div class="sub" id="subtitle"></div>
  <div class="sub" id="filled"></div>
  <div class="group">Furniture</div>
  <div id="furniture"></div>
  <div class="group">Added</div>
  <div id="added"></div>
  <div class="group">Room</div>
  <div id="fixed"></div>
  <div class="buttons">
    <button id="view-top">From above</button>
    <button id="view-inside">From inside</button>
    <button id="all-scans">All as scanned</button>
    <button id="all-models">All as models</button>
    <button id="reset">Reset layout</button>
    <button id="export">Save layout</button>
    <button id="load" title="A layout saved here, with its added objects">Load layout…</button>
    <button id="show-filled" title="Tint the walls, floor and ceiling where the video saw nothing: amber is plain paint continued, magenta was invented by the inpainting model">Show filled areas</button>
    <button id="add" title="A .glb or .gltf model, placed on the floor where you are looking (or drop the file on the room)">Add object…</button>
  </div>
  <input type="file" id="picker" hidden>
  <div class="sub" id="summary" style="margin: 10px 2px 0"></div>
</aside>
<button id="menu" title="Pieces and views">☰</button>
<div id="selection" hidden>
  <span class="title" id="sel-title"></span><span class="size" id="sel-size"></span><span class="source" id="sel-source"></span>
  <button id="turn-left" title="Turn left (Q)">⟲ 15°</button>
  <button id="turn-right" title="Turn right (E)">⟳ 15°</button>
  <button id="swap" title="">Show clean model</button>
  <input type="color" id="tint" title="Colour this piece">
  <button id="untint" title="Back to its own colours" hidden>Own colour</button>
  <label id="height-wrap" title="Its height; the model scales evenly" hidden>H <input type="number" id="height" min="1" step="1"> cm</label>
  <button id="hide" title="Hide (H)">Hide</button>
  <button id="put-back" title="Back to where it was filmed">Put back</button>
</div>
<div id="hint">Click a piece to select it · drag it across the floor · Q / E turn · M scan, clean or generated model · H hide · Esc deselect · drop a .glb to add it</div>
<div id="toast" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
